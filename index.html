* { box-sizing: border-box; }
html, body {

  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
body {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}
.masthead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 22px;
}
.masthead h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
  text-wrap: balance;
}
.masthead .sub {
  color: var(--text-dim);
  font-size: 0.82rem;
  letter-spacing: 0.02em;
}
.asof {
  text-align: right;
  font-size: 0.72rem;
  color: var(--text-faint);
  font-family: var(--mono);
  white-space: nowrap;
  padding-top: 4px;
}
.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.hero-label {
  font-size: 0.7rem;

  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.hero-value {

  font-size: 2.1rem;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: -0.01em;
}
.toggle {
  display: flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
  font-size: 0.78rem;
}
.toggle button {
  border: none;
  background: transparent;
  color: var(--text-dim);
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--sans);
  font-weight: 600;
}
.toggle button.active {
  background: var(--gold-dim);
  color: var(--bg);
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px 14px;
  margin-bottom: 18px;
}
.panel-title {

  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.panel-title-row {

  align-items: center;
  justify-content: space-between;

  flex-wrap: wrap;
  margin-bottom: 10px;

.panel-title-row .panel-title { margin-bottom: 0; }
#chartWrap { width: 100%; overflow-x: auto; }
canvas#equityChart { display: block; width: 100%; height: 160px; }
.chart-caption {
  font-size: 0.72rem;
  color: var(--text-faint);
  margin-top: 6px;
  font-family: var(--mono);
}
.rows { display: flex; flex-direction: column; }
.row {
  display: grid;
  grid-template-columns: 20px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.rows .row:last-child { border-bottom: none; }
.rank {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-faint);
  text-align: right;
}
.row-main { min-width: 0; }
.row-name {
  font-weight: 600;
  font-size: 0.92rem;
  margin-bottom: 3px;
}
.bar-track {
  height: 6px;
  border-radius: 3px;
  background: var(--surface-2);
  overflow: hidden;
  margin-bottom: 4px;
}
.bar-fill { height: 100%; border-radius: 3px; }
.bar-fill.pos { background: var(--win); }
.bar-fill.neg { background: var(--loss); }
.row-meta {
  font-size: 0.7rem;
  color: var(--text-faint);
  font-family: var(--mono);
}
.row-warning {
  font-size: 0.7rem;
  color: var(--loss);
  font-weight: 600;
  margin-top: 4px;
}
.heartbeat-banner {

  padding: 8px 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--loss) 15%, transparent);

.heartbeat-banner.show { display: block; }
.row-value {

.row-value.neg { color: var(--loss); }

.row-daily.pos { color: var(--win-dim); }

.chart-legend .dot.sell { background: var(--sell); }

.detail-stat .v.pos { color: var(--win); }

.hero-stats { display: flex; gap: 28px; }

}
.empty-note {

  color: var(--text-faint);
  font-style: italic;
  padding: 6px 0;
}
footer {
  text-align: center;
  font-size: 0.68rem;
  color: var(--text-faint);
  margin-top: 8px;
  font-family: var(--mono);

let mode = "pips"; // or "dollars"
let rankMode = "today"; // or "winrate"
let chartType = "cumulative"; // or "daily"
let selectedEa = null; // null = fleet-wide; else an EA name from per_ea_trades
let markerHits = []; // populated by drawChart in daily mode, used for click hit-testing
let openTooltipTrade = null; // the trade object currently shown in the tooltip, or null

// Real per-EA trades (main account AND Pepperstone alike, see
// build_ea_dashboard.py's per_ea_trades), sorted chronologically.
function eaTrades(name) {
  return (DATA.per_ea_trades || []).filter(t => t.ea === name).sort((a, b) => a.t - b.t);
}
// Fresh cumulative-pips curve for ONE EA, built from scratch -- never
// reuses DATA.equity_curve's cum_pips, which is deliberately fleet-wide/
// main-account-only so it keeps matching the hero stat.
function perEaCurve(name) {
  let cum = 0;
  return eaTrades(name).map(t => {
    cum += t.pips;
    return { t: t.t, cum_pips: Math.round(cum * 10) / 10, pips: t.pips, ea: name };
  });
}
function chartTradeSource() {
  // fleet-wide view must match equity_curve's composition -- both now
  // cover every EA shown on the page (main account + Pepperstone), so
  // this daily-net figure always tallies with the hero "fleet net" stat.
  return selectedEa ? eaTrades(selectedEa) : (DATA.per_ea_trades || []).slice().sort((a, b) => a.t - b.t);
}
function chartCumulativeSource() {
  return selectedEa ? perEaCurve(selectedEa) : DATA.equity_curve;
}
function updateChartTitle() {
  const base = chartType === "daily" ? "Individual real closed trades" : "Cumulative real closed-trade pips";
  document.getElementById("chartTitle").textContent = base + (selectedEa ? ", " + selectedEa : ", fleet-wide");
  document.getElementById("chartLegend").style.display = chartType === "daily" ? "flex" : "none";
}

function sortedLiveEas() {
  const eas = DATA.live_eas.slice();
  if (rankMode === "winrate") {
    eas.sort((a, b) => {
      if (a.win_rate === null && b.win_rate === null) return 0;
      if (a.win_rate === null) return 1;
      if (b.win_rate === null) return -1;
      return b.win_rate - a.win_rate;
    });
  } else {
    eas.sort((a, b) => b.daily_net_pips - a.daily_net_pips);
  }
  return eas;
}

function fmtPips(p) {
  const sign = p > 0 ? "+" : "";
  return sign + p.toFixed(1) + "p";
}
function fmtDollars(p) {
  const d = p * DATA.dollars_per_pip_001lot;
  const sign = d >= 0 ? "+" : "-";
  return sign + "$" + Math.abs(d).toFixed(2);
}
function fmtValue(p) {
  return mode === "pips" ? fmtPips(p) : fmtDollars(p);
}

// 2026-08-22: the compounding EA (magic 20260841) has a real lot size
// that varies trade to trade with the account balance -- the flat
// "@ 0.1 lot" hypothetical every other row shows would be actively
// misleading for it, since that's not how it actually trades. Shows
// its REAL dollar P&L (net_dollars_real, sourced from MT5's own
// deal.profit, not a fixed-rate pip conversion) instead.
const COMPOUNDING_MAGIC = 20260841;
function dollarNoteHtml(e) {
  if (e.n === 0) return "";
  if (e.magic === COMPOUNDING_MAGIC) {
    const sign = e.net_dollars_real >= 0 ? "+" : "-";
    return "(real: " + sign + "$" + Math.abs(e.net_dollars_real).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ", compounding)";
  }
  return "(~$" + e.net_dollars_at_01lot.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " @ 0.1 lot)";
}

// Always displays the user's confirmed real local time (fixed UTC+1
// offset from the server, DATA.local_tz_offset_hours) regardless of
// whatever timezone the VIEWING device/browser happens to be set to
// -- toLocaleString(undefined, ...) alone would silently follow the
// viewer's device TZ instead, which can drift from the user's actual
// real local time (this project has hit that exact mismatch before,
// see feedback_local_timezone.md).
function toLocalFixed(date) {
  return new Date(date.getTime() + DATA.local_tz_offset_hours * 3600 * 1000);
}

function renderAsOf() {
  const dt = toLocalFixed(new Date(DATA.generated_at_utc));
  const opts = { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short", timeZone: "UTC" };
  document.getElementById("asOf").textContent = "as of " + dt.toLocaleString(undefined, opts) + " (local)";
}

function renderHero() {
  document.getElementById("fleetDaily").textContent = fmtValue(DATA.fleet_daily_pips);
  document.getElementById("fleetTotal").textContent = fmtValue(DATA.fleet_total_pips);
}

function detailStatsRow(b) {
  const profCls = b.profit_pips > 0 ? "pos" : "";
  const lossCls = b.loss_pips < 0 ? "neg" : "";
  return `
    <div class="detail-group-row">
      <div class="detail-stat"><div class="k">Trade total</div><div class="v">${b.n}</div></div>
      <div class="detail-stat"><div class="k">Profit</div><div class="v ${profCls}">${b.n_profit} trade${b.n_profit === 1 ? "" : "s"}, ${fmtValue(b.profit_pips)}</div></div>
      <div class="detail-stat"><div class="k">Loss</div><div class="v ${lossCls}">${b.n_loss} trade${b.n_loss === 1 ? "" : "s"}, ${fmtValue(b.loss_pips)}</div></div>
      ${b.n_scratch > 0 ? `<div class="detail-stat"><div class="k">Scratch</div><div class="v">${b.n_scratch}</div></div>` : ""}
    </div>
  `;
}

function detailStatsHtml(daily, total) {
  return `
    <div class="detail-group">
      <div class="detail-group-label">Today</div>
      ${detailStatsRow(daily)}
    </div>
    <div class="detail-group">
      <div class="detail-group-label">Total (all history)</div>
      ${detailStatsRow(total)}
    </div>
  `;
}

function renderRows(containerId, eas) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  if (eas.length === 0) {
    el.innerHTML = '<div class="empty-note">none</div>';
    return;
  }
  const maxAbs = Math.max(1, ...eas.map(e => Math.abs(e.net_pips)));
  eas.forEach((e, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const barPct = Math.min(100, Math.abs(e.net_pips) / maxAbs * 100);
    const cls = e.net_pips > 0 ? "pos" : (e.net_pips < 0 ? "neg" : "zero");
    const dailyCls = e.daily_net_pips > 0 ? "pos" : (e.daily_net_pips < 0 ? "neg" : "zero");
    const winTxt = e.win_rate === null ? "&mdash;" : e.win_rate.toFixed(1) + "%";
    const nTxt = e.n === 0 ? "n=0, no trades yet" : ("n=" + e.n + " &middot; " + winTxt + " win");
    // 2026-08-17: unique per-row key, not just magic -- Independent
    // (Pepperstone) shares magic 20260826 with the main account's own
    // Independent row, and a duplicate DOM id would make the detail
    // panel toggle break for one of the two rows.
    const detailKey = `${e.magic}-${i}`;
    const warningHtml = e.warning
      ? `<div class="row-warning">&#9888; ${e.warning}</div>`
      : "";
    if (e.name === selectedEa) row.classList.add("selected");
    row.innerHTML = `
      <div class="rank">${i + 1}</div>
      <div class="row-main">
        <div class="row-name">${e.name}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${e.n === 0 ? 0 : barPct}%"></div></div>
        <div class="row-meta">${nTxt}</div>
        ${warningHtml}
      </div>
      <div>
        <div class="row-value ${dailyCls}">${e.daily_n === 0 ? "&mdash;" : fmtValue(e.daily_net_pips)}</div>
        <div class="row-daily ${cls}">total: ${e.n === 0 ? "&mdash;" : fmtValue(e.net_pips)}</div>
        <div class="row-dollar-note">${dollarNoteHtml(e)}</div>
      </div>
      <div class="detail" id="detail-${detailKey}">
        ${detailStatsHtml(e.daily_breakdown, e.breakdown)}
      </div>
    `;
    row.addEventListener("click", () => {
      document.getElementById("detail-" + detailKey).classList.toggle("open");
      // toggle chart selection via direct class manipulation (not a full
      // renderRows() re-render) so other rows' open/closed detail panels
      // aren't reset in the process.
      selectedEa = (selectedEa === e.name) ? null : e.name;
      el.querySelectorAll(".row.selected").forEach(r => r.classList.remove("selected"));
      if (selectedEa === e.name) row.classList.add("selected");
      hideTooltip();
      updateChartTitle();
      drawChart();
    });
    el.appendChild(row);
  });
}

function hideTooltip() {
  openTooltipTrade = null;
  document.getElementById("markerTooltip").classList.remove("show");
}

function showTooltip(t) {
  openTooltipTrade = t;
  const el = document.getElementById("markerTooltip");
  const dirCls = t.is_buy ? "dir-buy" : "dir-sell";
  const dirTxt = t.is_buy ? "BUY" : "SELL";
  const pipsCls = t.pips > 0 ? "pos" : (t.pips < 0 ? "neg" : "");
  const dOptFull = { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "UTC" };
  const entryDt = toLocalFixed(new Date(t.entry_time * 1000));
  const exitDt = toLocalFixed(new Date(t.t * 1000));
  el.innerHTML = `
    <div class="tt-head"><span class="${dirCls}">${dirTxt}</span><span>${t.ea}</span></div>
    <div class="tt-row"><span class="k">Entry</span><span class="v">${t.entry_price} &middot; ${entryDt.toLocaleString(undefined, dOptFull)}</span></div>
    <div class="tt-row"><span class="k">Exit</span><span class="v">${t.exit_price} &middot; ${exitDt.toLocaleString(undefined, dOptFull)}</span></div>
    <div class="tt-row"><span class="k">Volume</span><span class="v">${t.volume}</span></div>
    <div class="tt-row"><span class="k">Result</span><span class="v ${pipsCls}">${fmtValue(t.pips)} (real $${t.real_dollar >= 0 ? "+" : ""}${t.real_dollar.toFixed(2)})</span></div>
  `;
  el.classList.add("show");
}

function drawChart() {
  const canvas = document.getElementById("equityChart");
  const wrap = document.getElementById("chartWrap");
  const dpr = window.devicePixelRatio || 1;
  const cssW = wrap.clientWidth;
  const cssH = 160;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssW, cssH);
  markerHits = [];
  canvas.classList.toggle("has-markers", chartType === "daily");

  if (chartType === "daily") {
    drawDailyChart(ctx, canvas, cssW, cssH);
  } else {
    drawCumulativeChart(ctx, canvas, cssW, cssH);
  }
}

function drawCumulativeChart(ctx, canvas, cssW, cssH) {
  const curve = chartCumulativeSource();
  if (!curve || curve.length === 0) {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--text-faint");
    ctx.font = "12px " + getComputedStyle(document.documentElement).getPropertyValue("--mono");
    ctx.fillText("no closed trades yet", 8, cssH / 2);
    document.getElementById("chartCaption").textContent = " ";
    return;
  }

  const pad = { l: 8, r: 8, t: 14, b: 14 };
  const vals = curve.map(p => mode === "pips" ? p.cum_pips : p.cum_pips * DATA.dollars_per_pip_001lot);
  const minV = Math.min(0, ...vals);
  const maxV = Math.max(0, ...vals);
  const span = (maxV - minV) || 1;
  const n = curve.length;

  const xAt = i => pad.l + (n === 1 ? 0 : (i / (n - 1)) * (cssW - pad.l - pad.r));
  const yAt = v => pad.t + (1 - (v - minV) / span) * (cssH - pad.t - pad.b);

  const style = getComputedStyle(document.documentElement);
  ctx.strokeStyle = style.getPropertyValue("--border");
  ctx.lineWidth = 1;
  ctx.beginPath();
  const zeroY = yAt(0);
  ctx.moveTo(pad.l, zeroY);
  ctx.lineTo(cssW - pad.r, zeroY);
  ctx.stroke();

  const gold = style.getPropertyValue("--gold").trim();
  ctx.beginPath();
  ctx.moveTo(xAt(0), zeroY);
  vals.forEach((v, i) => ctx.lineTo(xAt(i), yAt(v)));
  ctx.lineTo(xAt(n - 1), zeroY);
  ctx.closePath();
  ctx.fillStyle = gold + "22";
  ctx.fill();

  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = xAt(i), y = yAt(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = gold;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  const lastX = xAt(n - 1), lastY = yAt(vals[n - 1]);
  ctx.beginPath();
  ctx.arc(lastX, lastY, 3.2, 0, Math.PI * 2);
  ctx.fillStyle = gold;
  ctx.fill();

  const first = toLocalFixed(new Date(curve[0].t * 1000));
  const last = toLocalFixed(new Date(curve[n - 1].t * 1000));
  const dOpt = { day: "2-digit", month: "short", timeZone: "UTC" };
  document.getElementById("chartCaption").textContent =
    first.toLocaleDateString(undefined, dOpt) + " to " + last.toLocaleDateString(undefined, dOpt) +
    "  -  " + n + " real closed trades  -  ends at " + fmtValue(curve[n - 1].cum_pips);
}

function drawDailyChart(ctx, canvas, cssW, cssH) {
  const trades = chartTradeSource();
  if (!trades || trades.length === 0) {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--text-faint");
    ctx.font = "12px " + getComputedStyle(document.documentElement).getPropertyValue("--mono");
    ctx.fillText("no closed trades yet", 8, cssH / 2);
    document.getElementById("chartCaption").textContent = " ";
    return;
  }

  const pad = { l: 10, r: 10, t: 14, b: 14 };
  const vals = trades.map(t => mode === "pips" ? t.pips : t.pips * DATA.dollars_per_pip_001lot);
  const minV = Math.min(0, ...vals);
  const maxV = Math.max(0, ...vals);
  const span = (maxV - minV) || 1;
  const n = trades.length;

  const xAt = i => pad.l + (n === 1 ? (cssW - pad.l - pad.r) / 2 : (i / (n - 1)) * (cssW - pad.l - pad.r));
  const yAt = v => pad.t + (1 - (v - minV) / span) * (cssH - pad.t - pad.b);

  const style = getComputedStyle(document.documentElement);
  ctx.strokeStyle = style.getPropertyValue("--border");
  ctx.lineWidth = 1;
  ctx.beginPath();
  const zeroY = yAt(0);
  ctx.moveTo(pad.l, zeroY);
  ctx.lineTo(cssW - pad.r, zeroY);
  ctx.stroke();

  const buyColor = style.getPropertyValue("--buy").trim();
  const sellColor = style.getPropertyValue("--sell").trim();
  const r = Math.max(2.4, Math.min(4.5, (cssW - pad.l - pad.r) / n / 2.2));

  trades.forEach((t, i) => {
    const x = xAt(i), y = yAt(mode === "pips" ? t.pips : t.pips * DATA.dollars_per_pip_001lot);
    const isOpen = openTooltipTrade && openTooltipTrade.t === t.t && openTooltipTrade.ea === t.ea && openTooltipTrade.entry_time === t.entry_time;
    ctx.beginPath();
    ctx.arc(x, y, isOpen ? r + 1.6 : r, 0, Math.PI * 2);
    ctx.fillStyle = t.is_buy ? buyColor : sellColor;
    ctx.globalAlpha = isOpen ? 1 : 0.78;
    ctx.fill();
    if (isOpen) {
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = style.getPropertyValue("--text").trim();
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    markerHits.push({ x: x, y: y, trade: t });
  });

  const first = toLocalFixed(new Date(trades[0].t * 1000));
  const last = toLocalFixed(new Date(trades[n - 1].t * 1000));
  const dOpt = { day: "2-digit", month: "short", timeZone: "UTC" };
  const netAll = trades.reduce((s, t) => s + t.pips, 0);
  document.getElementById("chartCaption").textContent =
    first.toLocaleDateString(undefined, dOpt) + " to " + last.toLocaleDateString(undefined, dOpt) +
    "  -  " + n + " real closed trades  -  net " + fmtValue(netAll);
}

function handleCanvasClick(evt) {
  if (chartType !== "daily" || markerHits.length === 0) return;
  const canvas = document.getElementById("equityChart");
  const rect = canvas.getBoundingClientRect();
  const cx = evt.clientX - rect.left;
  const cy = evt.clientY - rect.top;
  let closest = null, closestDist = 999;
  markerHits.forEach(m => {
    const d = Math.hypot(m.x - cx, m.y - cy);
    if (d < closestDist) { closestDist = d; closest = m; }
  });
  if (closest && closestDist <= 10) {
    if (openTooltipTrade && openTooltipTrade.t === closest.trade.t && openTooltipTrade.entry_time === closest.trade.entry_time) {
      hideTooltip();
    } else {
      showTooltip(closest.trade);
    }
    drawChart();
  } else {
    hideTooltip();
    drawChart();
  }
}

function renderHeartbeat() {
  const el = document.getElementById("heartbeatBanner");
  const stale = (DATA.zone_heartbeats || []).filter(h => !h.ok);
  if (stale.length === 0) { el.classList.remove("show"); return; }
  const parts = stale.map(h => `${h.label}: ${h.reason}`);
  el.textContent = "⚠ Zone data may be stale -- " + parts.join(" | ");
  el.classList.add("show");
}

function renderAll() {
  renderHero();
  renderHeartbeat();
  document.getElementById("liveRowsTitle").textContent =
    rankMode === "winrate" ? "Live fleet, ranked by win rate" : "Live fleet, ranked by today's pips";
  renderRows("liveRows", sortedLiveEas());
  updateChartTitle();
  drawChart();
}

document.getElementById("equityChart").addEventListener("click", handleCanvasClick);

renderAsOf();
renderAll();
</script>
